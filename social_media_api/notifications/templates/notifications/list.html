{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notifications</title>

    <link rel="stylesheet" href="{% static 'notifications/styles.css' %}">
</head>
<body>

    <h1>Notifications</h1>

    <p>Unread: {{ unread_count }}</p>

    {% for notification in notifications %}

        <div class="notification {% if not notification.is_read %}unread{% endif %}">

            <p>
                <strong>{{ notification.actor }}</strong>
                {{ notification.verb }}
            </p>

            <small>{{ notification.timestamp }}</small>

            <a href="{% url 'mark_notification_read' notification.id %}">
                Mark as read
            </a>

        </div>

    {% empty %}
        <p>No notifications</p>
    {% endfor %}

</body>
</html>
