<!-- templates/logout.html -->
{% extends 'base.html' %}

{% block title %}Logged Out{% endblock %}

{% block content %}
<h2>You have been logged out.</h2>
{% if messages %}
    {% for message in messages %}
        <p style="color: green;">{{ message }}</p>
    {% endfor %}
{% endif %}
<p><a href="{% url 'login' %}">Login again</a></p>
{% endblock %}
